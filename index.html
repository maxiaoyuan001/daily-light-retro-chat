<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Daily Light · Retro Chat</title><style>
:root{--accent:#454545;--out:#575757;--wall:#c5c5c5}*{box-sizing:border-box}body{margin:0;background:#17171c;font-family:Arial,Helvetica,sans-serif;color:#242424}.phone{max-width:520px;margin:auto;min-height:100dvh;background:var(--wall);display:flex;flex-direction:column}.status{height:31px;background:linear-gradient(#555,#303030);color:white;text-align:center;font-weight:bold;padding:6px}.top{background:linear-gradient(#555,#161616);color:white;height:66px;display:flex;align-items:center;justify-content:space-between;padding:9px;border-bottom:3px solid #111;text-shadow:0 1px #000}.top button,.tabs button,.composer button,.modal button{border:1px solid #111;border-radius:7px;background:linear-gradient(#555,#222);color:white;font-weight:bold;padding:10px 13px;box-shadow:inset 0 1px #777}.top strong{font-size:21px}.tabs{display:flex;background:#ececec;border-bottom:1px solid #999}.tabs button{flex:1;border-radius:0;background:linear-gradient(#f7f7f7,#d1d1d1);color:#555;border-color:#aaa;text-shadow:none}.tabs button.active{background:#b5b5b5;color:#222}.content{flex:1;padding:18px 12px 90px;overflow:auto;background-size:cover;background-position:center}.date{text-align:center;color:#666;font-size:12px;margin:10px 0 22px}.message{display:flex;gap:9px;align-items:flex-start;margin:15px 0}.message.mine{flex-direction:row-reverse}.avatar{height:42px;width:42px;object-fit:cover;border:1px solid #999;background:#ddd;flex-shrink:0}.bubble{position:relative;max-width:calc(100% - 65px);padding:13px;border-radius:5px;background:#fff;box-shadow:0 1px 2px #888;font-size:15px;line-height:1.55;white-space:pre-wrap}.mine .bubble{background:var(--out);color:white}.bubble:before{content:"";position:absolute;left:-7px;top:13px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:8px solid white}.mine .bubble:before{left:auto;right:-7px;border-right:0;border-left:8px solid var(--out)}.bubble .small{display:block;font-size:11px;opacity:.65;margin-bottom:6px;font-weight:bold}.word{cursor:pointer;border-bottom:1px dotted #888}.word:hover{background:#ffe8a5;color:#222}.composer{position:sticky;bottom:0;display:flex;gap:8px;background:#555;padding:10px;align-items:center}.composer input{flex:1;min-width:0;padding:12px;border:1px solid #333;border-radius:5px;background:#eee}.composer button{white-space:nowrap}.panel{background:#f4f4f4;border:1px solid #999;border-radius:7px;padding:16px;margin:10px 0;box-shadow:0 2px 4px #999}.panel h2{font-size:19px;margin:0 0 12px}.panel p{line-height:1.6}.panel input,.panel textarea,.panel select{width:100%;padding:10px;margin:6px 0 13px;border:1px solid #aaa;border-radius:4px}.panel textarea{min-height:90px}.action{background:linear-gradient(#666,#292929);border:1px solid #222;color:#fff;border-radius:6px;padding:12px;font-weight:bold;cursor:pointer}.action:disabled{opacity:.55}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:9px 0;border:1px solid #aaa;background:#fff;text-align:center;border-radius:4px;font-size:12px}.day.done{background:#555;color:#fff}.muted{font-size:12px;color:#777}.modalwrap{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.modal{max-height:85dvh;overflow-y:auto;overscroll-behavior:contain;width:min(430px,100%);background:#eee;border-radius:9px;padding:20px;box-shadow:0 10px 35px #111}.modal h2{margin:0 0 7px}.modal p{line-height:1.6}.hidden{display:none}.tag{font-size:11px;background:#dedede;border:1px solid #aaa;padding:3px 6px;border-radius:4px}.footer{font-size:12px;color:#666;margin-top:14px}button{cursor:pointer}button:focus-visible,.word:focus-visible{outline:3px solid #b38d48}@media(min-width:600px){.phone{margin:24px auto;min-height:calc(100dvh - 48px);box-shadow:0 10px 45px #0008;border:5px solid #333;border-radius:12px;overflow:hidden}}
</style></head><body><main class="phone"><div class="status">◕ 2:16　☾　　　　　　　　 ▮▮▮ ◉ ▰</div><header class="top"><button onclick="show('history')">Explore</button><strong id="chatTitle">Daily Light</strong><button onclick="show('settings')">⚙</button></header><nav class="tabs"><button id="tab-chat" class="active" onclick="show('chat')">Chats</button><button id="tab-history" onclick="show('history')">Archive</button><button id="tab-checkin" onclick="show('checkin')">Check-in</button><button id="tab-settings" onclick="show('settings')">Me</button></nav><section id="content" class="content"></section><div class="composer" id="composer"><input id="ask" placeholder="Tap or type an English word…" aria-label="Type a word"><button onclick="lookupInput()">Look up</button></div></main><div class="modalwrap hidden" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal" aria-live="polite"></div></div><script>
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA');const defaults={accent:'#454545',out:'#575757',wall:'#c5c5c5',title:'Daily Light',me:'',bot:'',background:''};let settings={...defaults,...JSON.parse(localStorage.getItem('retroSettings')||'{}')};let checkins=JSON.parse(localStorage.getItem('retroChecks')||'[]');let custom=JSON.parse(localStorage.getItem('retroVerses')||'{}');let active='chat',selected=today();const entries=[{verse:'Thy word is a lamp unto my feet, and a light unto my path.',ref:'Psalm 119:105',theme:'Guidance',explanation:'God’s word is compared to a lamp that illuminates the next step. The verse teaches that wisdom and spiritual guidance can help us move forward even without seeing the entire future.',grammar:'“Thy” means “your,” and “unto” means “to” or “for.” The lamp is a metaphor for guidance.',reflection:'You do not need to see the whole road to take one meaningful step.'},{verse:'Be still, and know that I am God.',ref:'Psalm 46:10',theme:'Stillness',explanation:'In a world of conflict and uncertainty, this verse calls people to stop striving and recognize God’s authority. It is not merely advice to relax.',grammar:'“Be” and “know” are imperative verbs. Their subject, “you,” is understood.',reflection:'Not everything that matters is within our control.'},{verse:'To every thing there is a season, and a time to every purpose under the heaven.',ref:'Ecclesiastes 3:1',theme:'Time',explanation:'Human life unfolds through different seasons, including joy, loss, action, and waiting. Wisdom includes recognizing the limits of our control over timing.',grammar:'“To every thing there is a season” means “There is a season for everything.” This is inverted word order.',reflection:'A season of waiting is not necessarily a season wasted.'},{verse:'For we walk by faith, not by sight.',ref:'2 Corinthians 5:7',theme:'Faith',explanation:'Paul describes the Christian life as trusting God’s promises even when their fulfillment cannot yet be seen.',grammar:'“Walk” is metaphorical for “live.” The phrase “not by sight” omits the repeated verb “walk.”',reflection:'Commitment sometimes begins before certainty arrives.'},{verse:'The LORD is nigh unto them that are of a broken heart.',ref:'Psalm 34:18 (first clause)',theme:'Compassion',explanation:'The psalm portrays God as near to those experiencing deep grief and suffering.',grammar:'“Nigh unto” is archaic for “near to.” “Them that” means “those who.”',reflection:'Suffering does not make a person less worthy of compassion.'},{verse:'A man’s heart deviseth his way: but the LORD directeth his steps.',ref:'Proverbs 16:9',theme:'Planning',explanation:'People make plans, but the course of life is not entirely within human control. The verse balances responsibility with humility.',grammar:'“Deviseth” means “devises”; “directeth” means “directs.” “Steps” is a metaphor for life’s course.',reflection:'Make plans, but leave room for the unexpected.'},{verse:'The heart of the prudent getteth knowledge; and the ear of the wise seeketh knowledge.',ref:'Proverbs 18:15',theme:'Learning',explanation:'Wisdom is not only possessing knowledge but also continually seeking it through careful attention and listening.',grammar:'“The prudent” means “prudent people.” “Getteth” and “seeketh” mean “gets” and “seeks.”',reflection:'A wise person remains willing to learn.'},{verse:'The LORD is my shepherd; I shall not want.',ref:'Psalm 23:1',theme:'Trust',explanation:'The speaker describes God as a shepherd who cares for and guides the people who depend on him.',grammar:'“Want” here has the older meaning “lack,” so “I shall not want” means “I shall not lack what I need.”',reflection:'Security is not always the same as possessing more.'},{verse:'Rejoice in hope; be patient in tribulation; be instant in prayer.',ref:'Romans 12:12',theme:'Endurance',explanation:'Paul encourages believers to sustain hope, endure hardship patiently, and remain devoted to prayer.',grammar:'Three parallel imperatives: “rejoice,” “be patient,” and “be instant.” Here “instant” means “constant” or “persistent.”',reflection:'Hope can coexist with a difficult present.'},{verse:'The light shineth in darkness; and the darkness comprehended it not.',ref:'John 1:5',theme:'Light',explanation:'John portrays divine light as continuing to shine despite darkness and opposition.',grammar:'“Shineth” means “shines.” “Comprehended” may convey “overcame” in this context, not merely “understood.”',reflection:'Darkness does not make light meaningless.'}];
const dict={prudent:['/ˈpruːdənt/','adjective','Careful and sensible, especially when considering future consequences.','A prudent decision requires evaluating the risks.','prudent investment · prudent approach','CET-6'],devise:['/dɪˈvaɪz/','verb','To invent or carefully plan a method or strategy.','They devised a practical study plan.','devise a plan · devise a solution','CET-6'],guidance:['/ˈɡaɪdəns/','noun','Advice or support that helps someone make decisions.','She sought guidance from her teacher.','seek guidance · provide guidance','CET-6'],compassion:['/kəmˈpæʃən/','noun','Sympathetic concern for people who are suffering, often accompanied by a wish to help.','Compassion can strengthen relationships.','show compassion · feel compassion for','CET-6'],perseverance:['/ˌpɜːrsəˈvɪrəns/','noun','Continued effort despite difficulty or delay.','Learning a language requires perseverance.','demonstrate perseverance','CET-6'],tribulation:['/ˌtrɪbjəˈleɪʃən/','noun','Serious difficulty or suffering.','They endured many trials and tribulations.','trials and tribulations','Advanced'],faith:['/feɪθ/','noun','Strong trust or belief, especially in God.','She maintained her faith during uncertainty.','have faith in · restore faith','Key'],discern:['/dɪˈsɜːrn/','verb','To recognize or distinguish something that is not obvious.','It is difficult to discern the pattern.','discern a difference','CET-6'],steadfast:['/ˈstedfæst/','adjective','Firm and determined, even in difficulty.','He remained steadfast in his commitment.','steadfast faith · steadfast determination','Advanced'],renew:['/rɪˈnuː/','verb','To restore or make something active again.','A short break renewed her motivation.','renew confidence · renew strength','CET-6'],endure:['/ɪnˈdʊr/','verb','To experience something difficult or continue despite it.','She endured a long period of uncertainty.','endure hardship · endure pressure','CET-6'],knowledge:['/ˈnɑːlɪdʒ/','noun','Information, understanding, or skills gained through learning or experience.','Reading helps us acquire knowledge.','acquire knowledge','Key'],sufficient:['/səˈfɪʃənt/','adjective','Enough for a particular purpose.','There was sufficient evidence to support the claim.','sufficient for · sufficient evidence','CET-6'],resilience:['/rɪˈzɪliəns/','noun','The capacity to recover and adapt after difficulties.','Resilience develops through support and experience.','emotional resilience','CET-6']};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tokens(s){return esc(s).replace(/\b[A-Za-z]+(?:[’'][A-Za-z]+)?\b/g,w=>`<span class="word" tabindex="0" role="button" onclick="lookup('${w.toLowerCase().replace(/'/g,'')}')" onkeydown="if(event.key==='Enter')this.click()">${w}</span>`)}function dateEntry(date){if(custom[date])return custom[date];const days=Math.floor((new Date(date+'T12:00:00')-new Date('2026-10-29T12:00:00'))/86400000);return entries[((days%entries.length)+entries.length)%entries.length]}function apply(){document.documentElement.style.setProperty('--accent',settings.accent);document.documentElement.style.setProperty('--out',settings.out);document.documentElement.style.setProperty('--wall',settings.wall);$('chatTitle').textContent=settings.title;$('content').style.backgroundImage=settings.background?`linear-gradient(#ffffff33,#ffffff33),url(${settings.background})`:''}function av(who){let src=who==='me'?settings.me:settings.bot;return src?`<img class="avatar" src="${src}">`:`<div class="avatar" style="display:grid;place-items:center;font-size:24px">${who==='me'?'☾':'✧'}</div>`}function msg(s,mine=false,label=''){return `<div class="message ${mine?'mine':''}">${av(mine?'me':'bot')}<div class="bubble">${label?`<span class="small">${esc(label)}</span>`:''}${tokens(s)}</div></div>`}function show(page){active=page;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+page));$('composer').style.display=page==='chat'?'flex':'none';apply();render()}function render(){let c=$('content');if(active==='chat'){let e=dateEntry(selected);c.innerHTML=`<div class="date">${esc(selected)} · ${esc(e.theme||'Daily Verse')}</div>`+msg('Good morning. Here is your verse for today. 🌙')+msg(e.verse,false,e.ref)+msg('What does this verse mean?',true)+msg(e.explanation,false,'Clear English Explanation')+msg('Can you explain the grammar?',true)+msg(e.grammar,false,'Grammar & Phrases')+msg('And your interpretation?',true)+msg(e.reflection,false,'Reflection')+`<div class="panel"><strong>Vocabulary practice</strong><p class="muted">Tap any English word in the chat for an English-only definition. Try: prudent, guidance, faith, resilience.</p><button class="action" onclick="checkToday()">${checkins.includes(selected)?'✓ Completed':'✓ Mark as Read'}</button></div>`}else if(active==='history'){let dates=Array.from({length:30},(_,i)=>{let d=new Date();d.setDate(d.getDate()-i);return d.toLocaleDateString('en-CA')});c.innerHTML=`<div class="panel"><h2>Message Archive</h2><p class="muted">Choose a date to reopen the conversation.</p>${dates.map(d=>`<button style="width:100%;margin:4px 0;text-align:left;background:#fff;border:1px solid #aaa;border-radius:5px;padding:12px" onclick="selected='${d}';show('chat')">${checkins.includes(d)?'✓ ':'◯ '}${d} · ${esc(dateEntry(d).theme||'Daily Verse')}<span style="float:right">›</span></button>`).join('')}</div>`}else if(active==='checkin'){let dates=Array.from({length:28},(_,i)=>{let d=new Date();d.setDate(d.getDate()-27+i);return d.toLocaleDateString('en-CA')});let streak=0,d=new Date();if(!checkins.includes(today()))d.setDate(d.getDate()-1);while(checkins.includes(d.toLocaleDateString('en-CA'))){streak++;d.setDate(d.getDate()-1)}c.innerHTML=`<div class="panel"><h2>My Reading Journal</h2><p><strong>${checkins.length}</strong> total check-ins &nbsp; · &nbsp; <strong>${streak}</strong> day streak</p><div class="days">${dates.map(x=>`<div class="day ${checkins.includes(x)?'done':''}" title="${x}">${x.slice(-2)}${checkins.includes(x)?' ✓':''}</div>`).join('')}</div><p class="muted">A small sentence every day is enough to build a lasting habit.</p><button class="action" onclick="selected=today();show('chat')">Read today's verse</button></div>`}else{c.innerHTML=`<div class="panel"><h2>Customize Your Chat</h2><label>Chat title<input id="titleInput" value="${esc(settings.title)}"></label><label>My avatar<input type="file" accept="image/*" onchange="upload(this,'me')"></label><label>Verse sender avatar<input type="file" accept="image/*" onchange="upload(this,'bot')"></label><label>Chat wallpaper<input type="file" accept="image/*" onchange="upload(this,'background')"></label><label>Wallpaper color <input type="color" id="wallInput" value="${settings.wall}"></label><label>My bubble color <input type="color" id="outInput" value="${settings.out}"></label><label>Theme accent <input type="color" id="accentInput" value="${settings.accent}"></label><button class="action" onclick="saveSettings()">Save appearance</button> <button class="action" onclick="resetSettings()">Reset</button></div><div class="panel"><h2>Add a Daily Verse</h2><p class="muted">Save a new English lesson to this browser for any date.</p><label>Date<input type="date" id="newDate" value="${today()}"></label><label>Verse<textarea id="newVerse" placeholder="Bible verse"></textarea></label><label>Reference<input id="newRef" placeholder="Psalm 23:1"></label><label>Explanation<textarea id="newExplain" placeholder="English explanation"></textarea></label><label>Grammar<textarea id="newGrammar" placeholder="Grammar and difficult phrases"></textarea></label><label>Reflection<textarea id="newReflection" placeholder="Your reflection"></textarea></label><button class="action" onclick="addVerse()">Publish to my chat</button></div><div class="panel"><h2>Backup</h2><button class="action" onclick="exportData()">Export my data</button><p class="muted">Settings, check-ins, and added verses are saved in this browser. They do not sync between devices.</p></div>`}}function checkToday(){if(!checkins.includes(selected))checkins.push(selected);localStorage.setItem('retroChecks',JSON.stringify(checkins));render()}function lookupInput(){lookup($('ask').value.trim())}function upload(input,key){let file=input.files[0];if(!file)return;if(file.size>3e6){alert('Choose an image smaller than 3 MB.');return}let r=new FileReader();r.onload=()=>{settings[key]=r.result;try{localStorage.setItem('retroSettings',JSON.stringify(settings));apply();render()}catch(e){alert('Image too large for browser storage. Try a smaller photo.')}};r.readAsDataURL(file)}function saveSettings(){settings.title=$('titleInput').value||'Daily Light';settings.wall=$('wallInput').value;settings.out=$('outInput').value;settings.accent=$('accentInput').value;localStorage.setItem('retroSettings',JSON.stringify(settings));show('chat')}function resetSettings(){if(confirm('Reset appearance?')){settings={...defaults};localStorage.setItem('retroSettings',JSON.stringify(settings));show('settings')}}function addVerse(){let date=$('newDate').value,verse=$('newVerse').value.trim(),ref=$('newRef').value.trim();if(!date||!verse||!ref){alert('Please enter a date, verse, and reference.');return}custom[date]={verse,ref,explanation:$('newExplain').value,grammar:$('newGrammar').value,reflection:$('newReflection').value,theme:'Personal Edition'};localStorage.setItem('retroVerses',JSON.stringify(custom));selected=date;show('chat')}function exportData(){let blob=new Blob([JSON.stringify({settings,checkins,custom},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily-light-backup.json';a.click();URL.revokeObjectURL(a.href)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&document.activeElement===$('ask'))lookupInput()});show('chat');

// In-page dictionary v2: local lesson vocabulary first, network only for other words.
const lessonGlossary={
lamp:['noun','A device that produces light. In this verse, a lamp represents guidance for the next step.','Her lamp lit the dark room.'],
thy:['possessive determiner','An old form of “your,” used when speaking to one person.','“Thy word” means “your word.”'],
unto:['preposition','An old form of “to” or “toward”; sometimes it means “for.”','“A light unto my path” means a light for my path.'],
nigh:['adjective / adverb','An old word meaning near or close.','“Nigh unto them” means near to them.'],
deviseth:['verb · archaic','An old form of “devises”: makes a plan or invents a method.','A person deviseth a plan: a person makes a plan.'],
directeth:['verb · archaic','An old form of “directs”: guides someone or determines a course.','The LORD directeth his steps.'],
getteth:['verb · archaic','An old form of “gets”: obtains or acquires something.','The prudent person getteth knowledge.'],
seeketh:['verb · archaic','An old form of “seeks”: tries to find or obtain something.','The wise person seeketh knowledge.'],
shineth:['verb · archaic','An old form of “shines”: gives out light.','The light shineth in darkness.'],
comprehended:['verb','Past tense of comprehend: understood. In John 1:5 it can also be interpreted as overcame or mastered.','The darkness did not overcome the light.'],
want:['verb','Usually to desire something. In “I shall not want,” it has the older meaning “lack what is needed.”','With a caring shepherd, I shall not want.'],
instant:['adjective','Usually immediate. In Romans 12:12, “instant in prayer” means constant or persistent in prayer.','Remain persistent in prayer.'],
still:['adjective / adverb','Quiet and without movement; as an adverb, continuing up to now. In “Be still,” it means stop and be quiet.','Be still and listen.'],
walk:['verb','To move on foot. In “walk by faith,” it figuratively means live or conduct your life.','We walk by faith.'],
feet:['plural noun','The plural of foot: the parts of the body on which a person stands and walks.','The lamp gives light to my feet.'],
path:['noun','A route or track. It can also mean the direction or course of a person’s life.','She chose a different path.'],
word:['noun','A unit of language. “God’s word” refers to God’s message or teaching.','This word has two meanings.'],
light:['noun / verb / adjective','Brightness that makes things visible; to give brightness; or not heavy. In the verse, it represents truth and guidance.','A light shines in the darkness.'],
heart:['noun','The organ that pumps blood; figuratively, the center of feelings, thoughts, or intentions.','She spoke from the heart.'],
broken:['adjective','Damaged or no longer whole. A broken heart means deep emotional pain.','He felt broken after the loss.'],
shepherd:['noun','A person who looks after sheep. In Psalm 23, a metaphor for God as a caring guide and protector.','The shepherd protects the flock.'],
lord:['noun','A ruler or master. In the Bible, LORD is a title used for God.','The LORD is my shepherd.'],
god:['noun','In Christianity, the supreme divine being, creator, and ruler of all things.','The psalm expresses trust in God.'],
faith:['noun','Trust or belief, especially trust in God and his promises.','She held on to her faith.'],
sight:['noun','The ability to see; what can be seen with the eyes.','The mountain came into sight.'],
season:['noun','One of the divisions of the year; also a period suited to a particular activity or experience.','There is a season for everything.'],
purpose:['noun','The reason for doing something or the goal it is intended to achieve.','Her work gave her a sense of purpose.'],
heaven:['noun','In religious belief, the dwelling place of God; in older language, the sky.','“Under the heaven” means in this earthly world.'],
time:['noun','The passing of moments, or a particular moment or period.','Learning takes time.'],
wise:['adjective','Having good judgment based on experience and understanding.','A wise person remains willing to learn.'],
ear:['noun','The part of the body used for hearing. In the verse, it represents attentive listening.','Lend an ear to good advice.'],
rejoice:['verb','To feel or express great happiness.','Rejoice in hope.'],
hope:['noun / verb','A wish or expectation that something good will happen.','They did not lose hope.'],
patient:['adjective','Able to wait or face difficulty without becoming easily upset.','Be patient while you learn.'],
prayer:['noun','Words or thoughts addressed to God, often expressing thanks, trust, or a request for help.','She found comfort in prayer.'],
darkness:['noun','The absence of light; figuratively, suffering, evil, or lack of understanding.','Light shines in darkness.'],
step:['noun / verb','A movement made by lifting and placing a foot; also one stage of a process.','Take one step at a time.'],
steps:['plural noun','Movements made with the feet; figuratively, actions or stages in life.','Make your next steps carefully.'],
illuminates:['verb','Gives light to something, or makes an idea easier to understand.','The lamp illuminates the path.'],
metaphor:['noun','A comparison that describes one thing as another to explain an idea.','“A lamp for my path” is a metaphor for guidance.'],
guidance:['noun','Advice or direction that helps someone decide what to do.','The teacher offered guidance.'],
spiritual:['adjective','Related to religious belief or a person’s inner life and values.','Reading can be a spiritual practice.'],
wisdom:['noun','The ability to use experience and understanding to make good judgments.','Wisdom includes knowing your limits.'],
entire:['adjective','Whole or complete; including every part.','You do not need to see the entire road.'],
future:['noun / adjective','The time that has not yet happened, or related to that time.','No one knows the entire future.'],
meaningful:['adjective','Having importance, value, or a clear purpose.','Take one meaningful step today.'],
forward:['adverb','Toward the front or toward progress.','Keep moving forward.'],
compared:['verb','Examined similarities or differences; in “compared to,” described as similar to something.','God’s word is compared to a lamp.'],
imperative:['adjective / noun','A verb form used to give an instruction, command, or request.','“Be still” is an imperative.'],
archaic:['adjective','Old-fashioned and no longer common in everyday language.','“Thy” is an archaic word.'],
inverted:['adjective','Changed from the usual order or position.','The sentence uses inverted word order.'],
unfolds:['verb','Develops or becomes clear gradually.','Life unfolds through different seasons.'],
fulfillment:['noun','The achievement of something hoped for, promised, or required.','They waited for the fulfillment of the promise.'],
striving:['verb / noun','Trying very hard to achieve something.','She was striving to improve.'],
authority:['noun','The power or right to give instructions or make decisions.','The passage refers to God’s authority.'],
uncertainty:['noun','A lack of certainty about what will happen or what is true.','Hope can remain during uncertainty.'],
conflict:['noun','A serious disagreement or struggle between opposing forces.','The psalm speaks in a setting of conflict.'],
grief:['noun','Deep sadness, especially after a loss.','Support matters during grief.'],
suffering:['noun','Physical or emotional pain and distress.','Compassion responds to suffering.'],
portrays:['verb','Describes or presents someone or something in a particular way.','The poem portrays God as a shepherd.'],
worthy:['adjective','Deserving respect, care, or attention.','Every person is worthy of compassion.'],
humility:['noun','Recognizing your limits without believing you are more important than others.','Wisdom requires humility.'],
responsibility:['noun','A duty to act or care for something and accept the results of your actions.','Planning involves responsibility.'],

for(const [k,v] of Object.entries(lessonGlossary)) if(!dict[k])dict[k]=['',v[0],v[1],v[2],'','Lesson vocabulary'];
const wordForms={devises:'devise',devised:'devise',devising:'devise',directs:'direct',gets:'get',seeks:'seek',shines:'shine',illuminate:'illuminates',compares:'compared',compare:'compared',prayers:'prayer',hearts:'heart',words:'word',lamps:'lamp',paths:'path',seasons:'season',knows:'know',knowing:'know',learns:'learn',learning:'learn',wants:'want'};
function normalizeWord(word){return String(word).trim().toLowerCase().replace(/[’']/g,"'").replace(/'s$/,'').replace(/[^a-z'-]/g,'');}
function inlineDefinition(word,data){
 let html='<h2 id="dictionaryTitle">'+esc(word)+'</h2>';
 if(data.note)html+='<p class="muted">'+esc(data.note)+'</p>';
 if(data.phonetic)html+='<p><strong>'+esc(data.phonetic)+'</strong></p>';
 for(const m of data.meanings||[])html+='<p class="tag">'+esc(m.partOfSpeech||'Meaning')+'</p><ol>'+m.definitions.map(d=>'<li>'+esc(d.definition)+(d.example?'<p><em>'+esc(d.example)+'</em></p>':'')+'</li>').join('')+'</ol>';
 if(data.collocations)html+='<p><strong>Collocations:</strong> '+esc(data.collocations)+'</p>';
 html+='<p class="muted">'+esc(data.source||'Daily Light lesson glossary')+'</p>';
 return html;
}
let lookupSerial=0;
let lookupCache={};try{lookupCache=JSON.parse(localStorage.getItem('retroDictionaryV2')||'{}')}catch{}
function displayLookup(html){$('modal').innerHTML=html+'<button class="action" onclick="closeModal()">Close</button>';$('overlay').classList.remove('hidden');$('modal').setAttribute('role','dialog');$('modal').setAttribute('aria-modal','true');$('modal').setAttribute('aria-label','English dictionary');}
async function lookup(word){
 const request=++lookupSerial,k=normalizeWord(word);if(!k)return;
 const key=dict[k]?k:(wordForms[k]||k),d=dict[key];
 if(d){displayLookup(inlineDefinition(word,{phonetic:d[0],note:key!==k?'Base form: '+key:'',meanings:[{partOfSpeech:d[1],definitions:[{definition:d[2],example:d[3]}]}],collocations:d[4]}));return;}
 if(lookupCache[k]){displayLookup(inlineDefinition(word,lookupCache[k]));return;}
 displayLookup('<h2>'+esc(word)+'</h2><p role="status">Looking up the English definition…</p>');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
 try{
 const response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(k),{signal:controller.signal});
 if(!response.ok)throw new Error(response.status===404?'not-found':'network');
 const rows=await response.json();if(!Array.isArray(rows)||!rows[0]?.meanings?.length)throw new Error('not-found');
 const data={phonetic:rows[0].phonetic||rows[0].phonetics?.find(p=>p.text)?.text||'',meanings:rows.slice(0,2).flatMap(x=>x.meanings||[]).slice(0,4).map(m=>({partOfSpeech:m.partOfSpeech,definitions:(m.definitions||[]).slice(0,3).map(d=>({definition:d.definition,example:d.example}))})),source:'Free Dictionary API · definitions shown here'};
 lookupCache[k]=data;try{localStorage.setItem('retroDictionaryV2',JSON.stringify(Object.fromEntries(Object.entries(lookupCache).slice(-200))))}catch{}
 if(request===lookupSerial)displayLookup(inlineDefinition(word,data));
 }catch(error){if(request===lookupSerial)displayLookup('<h2>'+esc(word)+'</h2><p role="status">'+(error.message==='not-found'?'No entry was found. Check the spelling or try the base form.':'The online dictionary is unavailable. Lesson vocabulary still works offline. Please try again.')+'</p><button class="action" id="retryLookup">Try again</button>');const retry=$('retryLookup');if(retry&&request===lookupSerial)retry.onclick=()=>lookup(word);
 }finally{clearTimeout(timer);}
}
function closeModal(){++lookupSerial;$('overlay').classList.add('hidden');}
